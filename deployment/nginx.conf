server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Maximum upload size for user photos / attachments
    client_max_body_size 20M;

    # Access and Error Logs
    access_log /var/log/nginx/facekey_access.log;
    error_log /var/log/nginx/facekey_error.log;

    # Frontend Static Files (React Build)
    location / {
        root /var/www/facekey/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location /assets/ {
        root /var/www/facekey/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Requests Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests (e.g. face processing)
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
